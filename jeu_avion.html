<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu Avion 3D / Arcade - Challenge VIP</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container.fullscreen-mode {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 999999 !important;
            background-color: #0b0f19;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0b0f19 0%, #1a1c29 100%);
        }
        /* Barre d'outils / HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hud-element {
            pointer-events: auto;
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }
        .hud-buttons {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }
        .icon-btn {
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }
        .icon-btn:hover {
            background: rgba(255, 140, 0, 0.8);
            transform: scale(1.05);
        }
        #fullscreen-btn {
            background: #ff8c00;
            border: none;
        }
        /* Écrans de menu / Game Over / Victoire */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            color: #ff8c00;
            margin-bottom: 10px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #a0aec0;
            margin-bottom: 25px;
            max-width: 400px;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff8c00 0%, #e07b00 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        /* Contrôles tactiles bas de page */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: rgba(255, 140, 0, 0.6);
            border-color: #ff8c00;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Barre HUD supérieure -->
    <div id="hud">
        <div class="hud-element" id="score-display">⭐ 0 Pts</div>
        <div class="hud-buttons">
            <button class="icon-btn" id="sound-btn" title="Activer/ couper le son">🔊</button>
            <button class="icon-btn" id="fullscreen-btn" title="Plein écran">⛶</button>
            <button class="icon-btn" id="pause-btn" title="Pause">⏸</button>
            <button class="icon-btn" id="close-btn" title="Quitter" onclick="retourDashboard()">✕</button>
        </div>
    </div>

    <!-- Le Canvas du Jeu -->
    <canvas id="gameCanvas"></canvas>

    <!-- Contrôles Tactiles (Optimisés Mobile) -->
    <div id="mobile-controls">
        <div class="control-group">
            <button class="ctrl-btn" id="btn-left">⬅️</button>
            <button class="ctrl-btn" id="btn-right">➡️</button>
        </div>
        <div class="control-group">
            <button class="ctrl-btn" id="btn-turbo" style="background: rgba(255,140,0,0.4); border-color: #ff8c00;">⚡</button>
        </div>
    </div>

    <!-- Écran de Démarrage -->
    <div id="start-screen" class="overlay-screen">
        <h1>Challenge VIP - Avion 3D</h1>
        <p>Esquivez les obstacles, récoltez les étoiles vertes (+15 Pts) et activez le turbo (⚡) pour survoler le score maximum !</p>
        <button class="btn-primary" id="start-btn">Lancer la Partie</button>
    </div>

    <!-- Écran Game Over -->
    <div id="gameover-screen" class="overlay-screen hidden">
        <h1>Partie Terminée</h1>
        <p id="final-score">Votre score : 0 Pts</p>
        <button class="btn-primary" id="restart-btn">Rejouer</button>
    </div>
</div>

<script>
    // Configuration Audio Web API sécurisée mobile
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!soundEnabled) return;
        initAudio();
        if (!audioCtx) return;

        try {
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'star') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'turbo') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gainNode.gain.setValueAtTime(0.4, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        } catch(e) {
            console.error("Audio error:", e);
        }
    }

    // Gestion Plein Écran CSS robuste Mobile
    const container = document.getElementById('game-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
        container.classList.toggle('fullscreen-mode');
        if(container.classList.contains('fullscreen-mode')) {
            fullscreenBtn.textContent = '❌';
        } else {
            fullscreenBtn.textContent = '⛶';
        }
        resizeCanvas();
    });

    // Gestion du Son Bouton
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    // Bouton Quitter / Retour
    function retourDashboard() {
        window.location.href = "dashboard_principal.html";
    }

    // Logique du Jeu Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameRunning = false;
    let score = 0;
    let plane = { x: canvas.width / 2, y: canvas.height - 120, width: 50, height: 30, speed: 7, isTurbo: false };
    let obstacles = [];
    let stars = [];
    let keys = { left: false, right: false, turbo: false };

    // Commandes Clavier PC
    window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.key === 'ArrowLeft' || e.key === 'q') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === ' ' || e.key === 'Shift') keys.turbo = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'q') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === ' ' || e.key === 'Shift') keys.turbo = false;
    });

    // Commandes Tactiles Mobiles
    const bindTouch = (id, keyName) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); keys[keyName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        el.addEventListener('mousedown', (e) => { initAudio(); keys[keyName] = true; });
        el.addEventListener('mouseup', () => { keys[keyName] = false; });
    };
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-turbo', 'turbo');

    function startGame() {
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        score = 0;
        obstacles = [];
        stars = [];
        plane.x = canvas.width / 2;
        gameRunning = true;
        loop();
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function spawnItems() {
        if (Math.random() < 0.03) {
            obstacles.push({
                x: Math.random() * (canvas.width - 40),
                y: -50,
                width: 40,
                height: 40,
                speed: 4 + Math.random() * 3
            });
        }
        if (Math.random() < 0.025) {
            stars.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                size: 25,
                speed: 3
            });
        }
    }

    function update() {
        if (!gameRunning) return;

        let currentSpeed = plane.speed;
        if (keys.turbo) {
            currentSpeed *= 1.8;
            plane.isTurbo = true;
        } else {
            plane.isTurbo = false;
        }

        if (keys.left && plane.x > 20) plane.x -= currentSpeed;
        if (keys.right && plane.x < canvas.width - plane.width - 20) plane.x += currentSpeed;

        spawnItems();

        // Mouvement Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.y += obs.speed;

            // Collision Avion / Obstacle
            if (
                plane.x < obs.x + obs.width &&
                plane.x + plane.width > obs.x &&
                plane.y < obs.y + obs.height &&
                plane.y + plane.height > obs.y
            ) {
                playSound('crash');
                gameRunning = false;
                document.getElementById('final-score').innerText = `Votre score : ${score} Pts`;
                document.getElementById('gameover-screen').classList.remove('hidden');
            }

            if (obs.y > canvas.height) {
                obstacles.splice(i, 1);
                score += 5;
            }
        }

        // Mouvement Étoiles
        for (let i = stars.length - 1; i >= 0; i--) {
            let s = stars[i];
            s.y += s.speed;

            // Collision Étoile
            if (
                plane.x < s.x + s.size &&
                plane.x + plane.width > s.x &&
                plane.y < s.y + s.size &&
                plane.y + plane.height > s.y
            ) {
                playSound('star');
                score += 15;
                stars.splice(i, 1);
            } else if (s.y > canvas.height) {
                stars.splice(i, 1);
            }
        }

        document.getElementById('score-display').innerText = `⭐ ${score} Pts`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dessiner les Obstacles (Immeubles/Rouges)
        ctx.fillStyle = '#ff4757';
        obstacles.forEach(obs => {
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 8);
            ctx.fill();
        });

        // Dessiner les Étoiles Vertes
        ctx.fillStyle = '#2ed573';
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x + s.size/2, s.y + s.size/2, s.size/2, 0, Math.PI * 2);
            ctx.fill();
        });

        // Dessiner l'Avion
        ctx.fillStyle = plane.isTurbo ? '#ff8c00' : '#ffa502';
        ctx.beginPath();
        ctx.moveTo(plane.x + plane.width / 2, plane.y);
        ctx.lineTo(plane.x + plane.width, plane.y + plane.height);
        ctx.lineTo(plane.x, plane.y + plane.height);
        ctx.closePath();
        ctx.fill();

        // Effet flamme turbo
        if (plane.isTurbo) {
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(plane.x + 15, plane.y + plane.height, 20, 15);
        }
    }

    function loop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(loop);
    }
</script>

</body>
</html>
