<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mur des Vainqueurs - Challenge VIP</title>
    <script>
        // Vérification de sécurité : Rediriger vers la connexion si l'utilisateur n'est pas connecté
if (!localStorage.getItem('vip_user_phone') && !localStorage.getItem('current_user')) {
    window.location.href = "login.html";}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #f8fafc; font-weight: 600; text-align: center; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; text-align: center; }
        
        .historique-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .historique-item {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
        }
        .historique-item span:first-child { color: #f97316; display: flex; align-items: center; gap: 8px; }
        .badge-score { color: #facc15; font-size: 16px; font-weight: 700; }
        
        .btn-retour {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .btn-retour:hover { background: #ea580c; transform: scale(1.02); }
    </style>
</head>
<body>

    <h1><i class="fas fa-trophy" style="color: #facc15;"></i> Mur des Vainqueurs</h1>
    <p class="subtitle">Retrouvez ici les performances et exploits des joueurs VIP !</p>

    <div class="historique-container" id="liste-historique">
        <!-- Dynamique -->
    </div>

    <a href="dashboard_principal.html" class="btn-retour">
        <i class="fas fa-arrow-left"></i> Retour au tableau de bord
    </a>

    <script>
        function masquerNumero(phone) {
            if (!phone) return "Joueur VIP";
            let cleanPhone = phone.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
            if (cleanPhone.length < 4) return "Joueur VIP";

            let premier = cleanPhone.slice(0, 2);
            let derniers = cleanPhone.slice(-2);
            let nbMasque = Math.max(3, cleanPhone.length - 4);
            let milieuMasque = "●".repeat(nbMasque);

            return `${premier}${milieuMasque}${derniers}`;
        }

        function chargerHistorique() {
            let users = JSON.parse(localStorage.getItem('vip_users')) || [];
            let vainqueurs = [];

            // On parcourt les utilisateurs pour récupérer leurs scores persistants
            users.forEach(user => {
                let userEmail = user.email || user.phone;
                let userKey = 'vip_persistent_data_' + userEmail.replace(/[@\s.]/g, '_');
                let persistentData = JSON.parse(localStorage.getItem(userKey));
                
                let points = 0;
                if (persistentData && persistentData.points !== undefined) {
                    points = persistentData.points;
                } else if (user.points !== undefined) {
                    points = user.points;
                }

                if (points > 0) {
                    vainqueurs.push({
                        id: masquerNumero(user.phone),
                        points: points
                    });
                }
            });

            // Tri pour afficher les meilleurs scores en haut
            vainqueurs.sort((a, b) => b.points - a.points);

            const conteneur = document.getElementById('liste-historique');
            conteneur.innerHTML = '';

            if (vainqueurs.length === 0) {
                conteneur.innerHTML = `<div class="historique-item" style="justify-content: center; color: #94a3b8;"><i class="fas fa-info-circle">&nbsp;</i> Aucun vainqueur ou score enregistré pour le moment.</div>`;
                return;
            }

            vainqueurs.forEach((v, index) => {
                let div = document.createElement('div');
                div.className = 'historique-item';
                div.innerHTML = `<span><i class="fas fa-award" style="color: #f97316;"></i> &nbsp; ${v.id}</span> <span class="badge-score">${v.points} Pts</span>`;
                conteneur.appendChild(div);
            });
        }

        chargerHistorique();
    </script>
</body>
</html>
